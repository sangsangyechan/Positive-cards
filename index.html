<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4eb"><meta name="description" content="나에게 건네는 365가지 작은 응원"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>병현이의 긍정카드</title></head><body><main class="app"><header class="top"><div class="brand" id="appTitle">병현이의 긍정카드<small>오늘도, 조금 더 괜찮은 너에게</small></div><button class="icon-btn" id="settingsBtn" aria-label="설정 열기">⚙</button></header><section id="welcome" class="view active"><div class="welcome"><div class="symbol">🪡🌼</div><h1 id="welcomeTitle">병현아, 오늘은 어떤 말이 기다릴까?</h1><p>작은 자수 한 땀처럼<br>마음에 남을 응원 한 장을 뽑아봐.</p><button class="primary" id="firstDraw">첫 카드 뽑기</button></div></section><section id="draw" class="view" aria-live="polite"><article class="card" id="card"><img class="art" id="art" alt="자수풍 그림"><div class="card-body"><div class="category" id="category"></div><h2 id="cardTitle"></h2><p id="cardMessage"></p></div></article><button class="primary" id="drawAgain">↝ 다른 카드 뽑기</button><div class="footer">중복 허용 · 언제든 다시 뽑을 수 있어</div></section><section id="settings" class="view panel"><h2>이름 설정</h2><p>이름을 바꾸면 제목과 카드 문구가 바뀌어. 다른 사람에게 선물할 수도 있어.</p><label class="field" for="nameInput">받는 사람 이름</label><input id="nameInput" maxlength="20" autocomplete="off" placeholder="예: 병현"><div class="stack"><button class="primary" id="saveName">이 이름으로 적용</button><button class="secondary" id="goGift">선물 링크 만들기</button><button class="secondary" id="backSettings">카드로 돌아가기</button></div></section><section id="gift" class="view panel"><h2>선물 링크 만들기</h2><p>링크를 받은 사람이 열면 이름이 적용된 긍정카드를 볼 수 있어.</p><label class="field" for="giftName">선물받는 사람 이름</label><input id="giftName" maxlength="20" placeholder="예: 지훈"><div class="stack"><button class="primary" id="shareGift">선물 링크 공유</button><button class="secondary" id="copyGift">링크 복사</button><button class="secondary" id="backGift">돌아가기</button></div><p class="hint" id="giftStatus" aria-live="polite">실제 공개 URL에 배포한 뒤 링크를 공유할 수 있어.</p></section><div id="connection" class="notice hidden" role="status">인터넷 연결이 필요해. 연결 후 다시 시도해 줘.</div></main><script src="app.js" defer></script></body></html>
